---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: keycloak-idp
  namespace: dv-test
spec:
  selector:
    matchLabels:
      app: keycloak-idp
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: keycloak-idp
    spec:
      containers:
        - name: keycloak-idp
          image: 192.168.100.11:31000/keycloak-idp-k8s:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8443
          env:
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              value: admin
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_DEBUG
              value: "true"
            - name: KC_LOG_LEVEL
              value: debug
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
      imagePullSecrets:
        - name: registry-auth


